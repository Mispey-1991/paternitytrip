        }

        .segment-btn {
            display: block; width: 100%; padding: 8px; margin: 4px 0; background: #f0f0f0;
            border: 1px solid #ccc; border-radius: 3px; cursor: pointer; text-align: left;
            font-size: 12px; transition: all 0.2s;
        }
        .segment-btn:hover { background: #e0e0e0; }
        .segment-btn.active { background: #2f9e44; color: white; font-weight: bold; }
        .legend {
            position: absolute; bottom: 10px; right: 10px; background: white; padding: 10px;
            border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 1000;
            font-size: 12px;
        }
        .legend-item { margin: 5px 0; display: flex; align-items: center; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .poi { background: #2f9e44 !important; }
        .hike { background: #e8590c !important; }

        let map = L.map('map').setView([47, -85], 5);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 16
        }).addTo(map);

        let currentSegment = null;
        let markers = [];
        let highlightedMarkers = new Set();

        // Create marker cluster group
        stops.forEach(stop => {
            let marker = L.circleMarker([stop.lat, stop.lon], {
                radius: 6,
                fillColor: categoryColors[stop.cat],
                color: '#fff',
                weight: 1.5,
                opacity: 0.7,
                fillOpacity: 0.8
            });

            marker.bindPopup(`<b>${stop.id}</b><br/>${stop.name}<br/><em>${stop.cat}</em>`);
            marker.on('click', () => {
                currentSegment = stop.seg;
                updateSegmentHighlight();
            });
            
            marker._stopData = stop;
            markers.push(marker);
            marker.addTo(map);
        });

        // Create segment buttons
        const segmentList = document.getElementById('segment-list');
        segments.forEach(seg => {
            const btn = document.createElement('button');
            btn.className = 'segment-btn';
            btn.textContent = `Segment ${seg.num}: ${seg.title}`;
            btn.onclick = () => {
                currentSegment = seg.num;
                updateSegmentHighlight();
                map.fitBounds(seg.bounds);
            };
            btn.id = `seg-${seg.num}`;
            segmentList.appendChild(btn);
        });

        function updateSegmentHighlight() {
            // Reset all markers
            markers.forEach(m => {
                m.setStyle({opacity: 0.3, fillOpacity: 0.3});
            });

            // Highlight current segment
            highlightedMarkers.clear();
            markers.forEach(m => {
                if (m._stopData.seg === currentSegment) {
                    m.setStyle({opacity: 0.9, fillOpacity: 0.8});
                    highlightedMarkers.add(m);
                }
            });

            // Update button states
            document.querySelectorAll('.segment-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (currentSegment) {
                const btn = document.getElementById(`seg-${currentSegment}`);
                if (btn) btn.classList.add('active');
            }
        }
