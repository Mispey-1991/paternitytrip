    <h1 style="font-size: 24pt; font-weight: bold; margin: 0 0 8pt 0;">Timmins → New Liskeard</h1>
    <div style="font-family: monospace; font-size: 8pt; color: #6b6660;">Hwy 11 S | ~185 km | ~2 hrs | 9 stops</div>
